[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-ml-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.11",
    "tenacity>=8.2",
    "structlog>=24.0",
    "minio>=7.2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "click>=8.1",
    "requests>=2.31",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/hitl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
